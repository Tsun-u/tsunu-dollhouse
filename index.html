<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小屋娃娃屋</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="theme-color" content="#f3ead9">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="loading" role="status">
  <strong>小屋娃娃屋</strong>
  <p>準備中<span class="dots"><i>.</i><i>.</i><i>.</i></span></p>
</div>
<script>
  // 載入畫面還在時出錯（網路斷了、素材載不到）：改成請玩家重新整理，不要一直轉
  addEventListener("error", () => {
    const loading = document.getElementById("loading");
    if (loading && !loading.classList.contains("done")) loading.querySelector("p").textContent = "沒有載入成功，請重新整理再試一次。";
  });
</script>
<main id="app">
  <header id="top">
    <nav id="tabs">
      <button data-tab="home" class="on">家</button>
      <button data-tab="puzzle">三消</button>
      <button data-tab="workshop">工坊</button>
      <button data-tab="closet">衣櫃</button>
      <button data-tab="cafe">商店街</button>
      <button data-tab="shop">家具店</button>
      <button data-tab="dolls">娃娃</button>
    </nav>
    <div id="status"><span id="money"></span><span id="currentDoll"></span></div>
  </header>

  <section id="home" class="tab on">
    <div id="roomTabs" class="chips"></div>
    <div id="toolbar">
      <span id="pieceActions"></span>
      <button id="flipBtn" class="icon-btn" disabled aria-label="轉向" title="轉向"></button>
      <button id="storeBtn" class="icon-btn" disabled aria-label="收回倉庫" title="收回倉庫"></button>
    </div>
    <div id="piecePalette" class="palette" hidden></div>
    <div id="tvChannels" class="channels" hidden></div>
    <canvas id="room"></canvas>
    <div id="dollPanel" hidden>
      <div class="panel-head"><span id="dollPanelTitle"></span></div>
      <div id="dollActions" class="chips"></div>
      <div id="giveChoices" class="chips" hidden></div>
    </div>
    <div id="dogPanel" hidden>
      <div class="panel-head"><span id="dogTitle"></span><button id="dogClose">收起</button></div>
      <div id="dogActions" class="chips"></div>
    </div>
    <div id="tablePanel" hidden>
      <div class="panel-head"><span id="tableTitle"></span><button id="tableClose">收起</button></div>
      <div id="tableItems" class="chips"></div>
      <div id="tablePut" class="chips"></div>
      <form id="noteForm"><input id="noteInput" type="text" maxlength="200" placeholder="留一張紙條…" autocomplete="off"><button type="submit">放</button></form>
    </div>
    <h2 class="section" data-icon="box">倉庫</h2>
    <div id="inventory" class="cards"></div>
    <details id="journalBox"><summary>最近發生的事</summary><div id="journal"></div></details>
  </section>

  <section id="closet" class="tab">
    <div id="closetWho" class="who-row" aria-label="幫誰換衣服"></div>
    <div id="closetBody">
      <div class="closet-stage"><canvas id="closetCanvas"></canvas><span id="closetUndo"></span></div>
      <div class="closet-list">
        <div id="wardrobe" class="cards"></div>
      </div>
    </div>
  </section>

  <section id="puzzle" class="tab">
    <div class="panel-head"><span id="puzzleInfo"></span><span><select id="puzzleShop" title="這一盤幫哪家店備料" hidden></select> <button id="puzzleCoop" hidden>一起玩</button> <button id="puzzleStart">開一盤</button></span></div>
    <div id="board"></div>
  </section>

  <section id="workshop" class="tab">
    <div class="panel-head"><span>材料：點一下放進工坊</span></div>
    <div id="materials" class="chips"></div>
    <div id="grid"></div>
    <div class="panel-head"><span>做好的商品</span></div>
    <div id="products" class="chips"></div>
  </section>

  <section id="cafe" class="tab">
    <canvas id="streetCanvas" title="點一樓看店、點出租的店面租店、點二樓回家"></canvas>
    <div id="rentPanel" class="rent" hidden>
      <span id="rentTitle"></span>
      <span id="rentChoices"></span>
      <span id="rentCancel"></span>
    </div>
    <div class="panel-head"><span id="cafeInfo"></span><button id="cafeToggle"></button></div>
    <canvas id="cafeCanvas"></canvas>
    <div id="decorPanel" class="rent" hidden>
      <span id="decorPanelTitle"></span>
      <span id="decorChoices"></span>
      <span id="decorClose"></span>
    </div>
    <div class="panel-head"><span id="cafeProductsHint">櫃台上的商品（點客人就出餐）</span></div>
    <div id="cafeProducts" class="chips"></div>
  </section>

  <section id="shop" class="tab">
    <div class="panel-head"><span id="shopMoney" class="money-line"></span></div>
    <h2 class="section" data-icon="sofa">家具</h2>
    <div id="shopList" class="cards"></div>
    <h2 class="section" data-icon="closet">衣服</h2>
    <div id="clothesShop" class="cards"></div>
    <h2 class="section" data-icon="build">蓋房間</h2>
    <div id="buildList" class="cards"></div>
    <h2 class="section" data-icon="floor"><span id="decorTitle"></span></h2>
    <div id="floorList" class="cards"></div>
    <h2 class="section" data-icon="wall">壁紙</h2>
    <div id="wallList" class="cards"></div>
    <h2 class="section" data-icon="sell">賣東西</h2>
    <div id="resaleList" class="cards"></div>
  </section>

  <section id="dolls" class="tab">
    <div class="panel-head"><span id="dollsInfo"></span></div>
    <div id="dollList"></div>
    <div id="creatorBox" hidden>
      <div class="panel-head"><span id="creatorTitle"></span><span class="creator-buttons"><span id="creatorCancel"></span><span id="creatorSave"></span></span></div>
      <div id="creator">
        <canvas id="creatorCanvas"></canvas>
        <div id="creatorOptions"></div>
      </div>
    </div>
    <details id="saveDetails"><summary id="saveSummary">存檔</summary>
    <div id="saveBox">
      <button id="exportSave">匯出存檔</button>
      <label class="item"><input id="importSave" type="file" accept="application/json" hidden>匯入存檔</label>
      <button id="cloudSave">存到雲端</button>
      <button id="cloudLoad">從雲端取回</button>
      <span id="saveInfo"></span>
    </div>
    </details>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
